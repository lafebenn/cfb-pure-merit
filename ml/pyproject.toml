[project]
name = "cfbml"
version = "0.1.0"
description = "CFB Pure Merit ML: game win probabilities, committee emulator, CFP simulator"
authors = [
    { name = "lafebenn", email = "willbennett2003@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.7.0",
    "numpy>=2.5.4",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.scripts]
cfbml = "cfbml.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
